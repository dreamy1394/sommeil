name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Tests et APK debug
        run: |
          set -o pipefail
          gradle test assembleDebug --stacktrace 2>&1 | tee build.log || {
            msg=$(grep -E "^e: |^w: .*sommeil|error:|What went wrong|FAILED|Execution failed|Could not|Caused by" -A2 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Erreurs de build::$msg"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: sommeil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
